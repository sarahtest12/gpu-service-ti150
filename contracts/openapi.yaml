openapi: 3.1.1
info:
  title: BI-V150 算法服务接口契约（Review）
  version: 0.2.0-review
  description: |
    CPU Web 后端访问 GPU 主机的统一 HTTP 契约。所有路径共用 HTTPS 端口和 GPU_API_KEY。
    x-implementation-status=implemented 表示当前代码已实现，不代表服务当前已启动。
    x-implementation-status=proposed 表示待实现的设计，当前请求该路径仍返回 404。
    本文件不启动服务、不发布路由，也不把未部署算法视为可用。
    YOLO 原生 gRPC 双向流由 x-grpc 指向的 detector.proto 定义；不转换为 JSON POST 接口。
    VLM 数据结构从本机锁定版本的 vLLM 协议模型导出。上游 schema 中出现的音频、视频等字段
    不代表本部署支持这些能力；本项目支持文本、图片、业务工具及其 SSE 输出，部署限制见操作描述。
servers:
  - url: https://{gpu_host}:{port}
    description: GPU 目标地址；证书须覆盖此名称。无调用方 IP 或域名白名单。
    variables:
      gpu_host:
        default: localhost
        description: CPU 后端实际可达的 GPU 地址；localhost 仅用于 GPU 本机联调。
      port:
        default: '8443'
security:
  - GpuApiKey: []
tags:
  - name: Health
    description: 已实现的网关存活与算法就绪接口。
  - name: VLM
    description: 已实现的 Qwen3.5-9B 图文、工具及 SSE 调用。
  - name: RAG
    description: 已实现的 BGE-M3 文本稠密向量接口；暂不部署重排序模型。
  - name: Monitor
    description: 已对齐口径的监控设计；当前未实现。
x-grpc:
  target: '{gpu_host}:{port}'
  tls: true
  metadata: 'authorization: Bearer <GPU_API_KEY>'
  method: /detector.v1.Detector/Detect
  streaming: bidirectional
  proto: ../yolov5v70-service/shared/detector_contract/detector.proto
  review_notes: ./yolo-grpc.md
  implementation_status: implemented
x-reserved-interfaces:
  - {method: POST, path: /rag/v1/rerank, status: reserved, current_http_status: 404}
  - {method: POST, path: /asr/v1/audio/transcriptions, status: reserved, current_http_status: 404}
  - {method: POST, path: /tts/v1/audio/speech, status: reserved, current_http_status: 404}
x-source:
  repository_commit: 88bb84a
  gateway: ../gateway/configuration.py
  server_configuration: ../gateway/config/server.json
  rag_configuration: ../rag_service/config/server.json
  vlm_configuration: ../vlm_service/config/server.json
  vlm_version: 0.17.0+corex.4.5.0.rc.11.20260701
  schema_models:
    - vllm.entrypoints.pooling.embed.protocol.EmbeddingCompletionRequest
    - vllm.entrypoints.pooling.embed.protocol.EmbeddingResponse
    - vllm.entrypoints.openai.chat_completion.protocol.ChatCompletionRequest
    - vllm.entrypoints.openai.chat_completion.protocol.ChatCompletionResponse
    - vllm.entrypoints.openai.chat_completion.protocol.ChatCompletionStreamResponse
    - vllm.entrypoints.openai.engine.protocol.ModelList
    - vllm.entrypoints.openai.engine.protocol.ErrorResponse
paths:
  /health/live:
    get:
      operationId: getGatewayLiveness
      tags: [Health]
      summary: 网关是否存活
      x-implementation-status: implemented
      description: |
        仅证明 NGINX 能响应，不聚合模型状态。算法停止时仍可返回 200。
        当前 NGINX 对此固定响应 location 未限定 HTTP 方法；客户端契约使用 GET。
      responses:
        '200':
          description: 网关存活。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GatewayLiveness'}
              example: {status: ok}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /vlm/health/ready:
    get:
      operationId: getVlmReadiness
      tags: [Health]
      summary: VLM 引擎是否就绪
      x-implementation-status: implemented
      description: 转发内部 /health。成功与引擎不可用的 503 均为空响应体，不是 JSON。
      responses:
        '200':
          description: 引擎健康；空响应体。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503':
          description: 上游引擎健康检查失败；空响应体。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /yolo/health/ready:
    get:
      operationId: getYoloReadiness
      tags: [Health]
      summary: YOLO 是否就绪
      x-implementation-status: implemented
      responses:
        '200':
          description: 检测服务就绪。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YoloReadiness'}
              example: {status: ok}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503':
          description: 进程可响应，但检测引擎尚未就绪。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YoloReadiness'}
              example: {status: unavailable}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /vlm/v1/models:
    get:
      operationId: listVlmModels
      tags: [VLM]
      summary: 获取 VLM 模型列表
      x-implementation-status: implemented
      description: 当前服务别名为 qwen3.5-9b；客户端使用别名，不使用 GPU 文件系统模型路径。
      responses:
        '200':
          description: 模型列表。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vlm_ModelList'}
              example:
                object: list
                data:
                  - {id: qwen3.5-9b, object: model, created: 1789020000, owned_by: vllm, max_model_len: 8192}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
        default: {$ref: '#/components/responses/UpstreamError'}
  /vlm/v1/chat/completions:
    post:
      operationId: createVlmChatCompletion
      tags: [VLM]
      summary: 图文理解、工具调用与流式生成
      x-implementation-status: implemented
      description: |
        stream=false 或省略时返回 JSON；stream=true 时返回 text/event-stream。
        SSE 每个 data 事件是 ChatCompletionStreamResponse JSON；[DONE] 是结束标记，不是 JSON。
        可能先发送 role 等空文本片段，工具参数可能跨片段；CPU 后端负责拼接、校验和执行工具。
        stream_options.include_usage=true 请求最终用量，最终用量事件的 choices 可为空。
        HTTP 200 后仍可能发生流内错误或断流；必须检查 finish_reason，不能把部分文本当作完整答案。
        finish_reason=length 表示达到生成上限；错误也可能作为 SSE data 错误对象传递。
        客户端断开会关闭上游连接；计算何时终止由引擎处理。不自动重试。

        当前部署：qwen3.5-9b、8192 token 上下文、最多两张图片、每张处理像素上限 786432。
        图片推荐使用 PNG/JPEG/WebP Base64 data URL；客户端限制单文件 8 MiB，网关限制请求体 24 MiB。
        8 MiB 是项目客户端限制，不是额外的网关单图校验。远程媒体仅允许 media.invalid，
        不开放任意远程拉取或本地文件；不提供视频、音频输入或直接 PDF 上传。
        CPU 先读取媒体，PDF 先提取文本或转为页面图片。
        chat_template_kwargs.enable_thinking=false 是当前 CPU 示例的默认请求选项，
        不是服务端强制改写。未知参数的处理和跨字段校验仍由锁定的 vLLM 版本决定。
      x-request-body-limit-bytes: 25165824
      x-max-active-requests: 4
      x-upstream-idle-timeout-seconds: 180
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Vlm_ChatCompletionRequest'}
            examples:
              text:
                summary: 非流式文本请求
                value:
                  model: qwen3.5-9b
                  messages: [{role: user, content: 请介绍一下自己}]
                  max_completion_tokens: 128
                  temperature: 0
                  stream: false
                  chat_template_kwargs: {enable_thinking: false}
              imageStream:
                summary: 图片理解与 SSE（有效的 1x1 PNG 示例；业务使用实际图片）
                value:
                  model: qwen3.5-9b
                  messages:
                    - role: user
                      content:
                        - {type: text, text: 请描述这张图片}
                        - type: image_url
                          image_url:
                            url: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4//8/AAX+Av4N70a4AAAAAElFTkSuQmCC
                  max_completion_tokens: 128
                  stream: true
                  stream_options: {include_usage: true}
                  chat_template_kwargs: {enable_thinking: false}
              tool:
                summary: 只读业务工具请求（业务工具在 CPU 执行）
                value:
                  model: qwen3.5-9b
                  messages: [{role: user, content: 查询订单 DEMO-1001}]
                  max_completion_tokens: 256
                  tools:
                    - type: function
                      function:
                        name: get_order_status
                        description: 按订单号查询状态
                        parameters:
                          type: object
                          properties: {order_id: {type: string}}
                          required: [order_id]
                  tool_choice: auto
                  chat_template_kwargs: {enable_thinking: false}
      responses:
        '200':
          description: 完整 JSON 响应或 SSE 字节流，取决于请求中的 stream。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vlm_ChatCompletionResponse'}
              example:
                id: chatcmpl-example
                object: chat.completion
                created: 1789020000
                model: qwen3.5-9b
                choices: [{index: 0, message: {role: assistant, content: 你好。}, finish_reason: stop}]
                usage: {prompt_tokens: 20, completion_tokens: 3, total_tokens: 23}
            text/event-stream:
              schema: {type: string, description: SSE 文本流；不是 JSON 数组。}
              x-event-data-schema: {$ref: '#/components/schemas/Vlm_ChatCompletionStreamResponse'}
              x-error-event-data-schema: {$ref: '#/components/schemas/Vlm_ErrorResponse'}
              x-terminal-event-data: '[DONE]'
              example: |
                data: {"id":"chatcmpl-example","object":"chat.completion.chunk","created":1789020000,"model":"qwen3.5-9b","choices":[{"index":0,"delta":{"role":"assistant","content":""},"finish_reason":null}]}

                data: {"id":"chatcmpl-example","object":"chat.completion.chunk","created":1789020000,"model":"qwen3.5-9b","choices":[{"index":0,"delta":{"content":"你好。"},"finish_reason":null}]}

                data: {"id":"chatcmpl-example","object":"chat.completion.chunk","created":1789020000,"model":"qwen3.5-9b","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

                data: {"id":"chatcmpl-example","object":"chat.completion.chunk","created":1789020000,"model":"qwen3.5-9b","choices":[],"usage":{"prompt_tokens":20,"completion_tokens":3,"total_tokens":23}}

                data: [DONE]

        '400': {$ref: '#/components/responses/UpstreamError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/UpstreamError'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/UpstreamError'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/UpstreamError'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
        default: {$ref: '#/components/responses/UpstreamError'}
  /rag/health/ready:
    get:
      operationId: getRagReadiness
      tags: [Health]
      summary: BGE-M3 引擎是否就绪
      x-implementation-status: implemented
      description: 转发内部 /health；200 和 503 均为空响应体。检查需要统一 key。
      responses:
        '200':
          description: BGE-M3 引擎健康；空响应体。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {description: 引擎不健康；空响应体。}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /rag/v1/models:
    get:
      operationId: listRagModels
      tags: [RAG]
      summary: 获取向量模型列表
      x-implementation-status: implemented
      description: 模型别名为 bge-m3；当前 max_model_len=2048。与 VLM 使用同一个 vLLM ModelList 数据结构。
      responses:
        '200':
          description: 向量模型列表。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vlm_ModelList'}
              example:
                object: list
                data:
                  - {id: bge-m3, object: model, created: 1789034400, owned_by: vllm, max_model_len: 2048}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
        default: {$ref: '#/components/responses/UpstreamError'}
  /rag/v1/embeddings:
    post:
      operationId: createRagEmbeddings
      tags: [RAG]
      summary: 使用 BGE-M3 生成 1024 维文本向量
      x-implementation-status: implemented
      description: |
        基于 input 的 vLLM EmbeddingCompletionRequest；推荐 model=bge-m3、input 为字符串或字符串数组、
        encoding_format=float。也支持该 tokenizer 的 token ID 输入与 base64 输出。
        请求/响应 schema 从当前锁定版本 vLLM 导出，不重新定义协议。
        本项目支持文本稠密向量；上游 messages/chat 模板、二进制编码等扩展不作为 CPU 示例的支持契约。
        encoding_format=bytes/bytes_only 是上游二进制扩展，响应为 application/octet-stream。

        默认 CLS pooling 和 L2 归一化，每段输出 1024 维。use_activation=false 会关闭归一化；
        入库与查询必须使用相同模型和预处理，推荐保持默认设置。BGE-M3 无需查询指令。
        不支持通过 dimensions 缩短向量；省略此参数。不提供 reranker、sparse 或 ColBERT 接口。
        模型原生上限为 8192 tokens，但当前服务配置每段最多 2048 tokens（含特殊 token），超长默认返回 400。
        truncate_prompt_tokens 为上游显式截断选项；CPU 示例不使用截断，应先对文档分块。
        引擎最多同时处理 4 段、每轮最多 2048 tokens；这不是每个 HTTP 请求的数组元素数上限。
        CPU 建议每次提交不超过 16 段；服务没有额外的数组长度硬限制，请求体仍限制为 256 KiB。
        CPU 后端负责向量库、召回、权限和 RAG 编排；回答生成调用现有 VLM。
        不自动重试；计费式 usage 是 tokenizer 统计，不能作为模型耗时。
      x-request-body-limit-bytes: 262144
      x-max-active-requests: 4
      x-upstream-idle-timeout-seconds: 60
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Rag_EmbeddingCompletionRequest'}
            examples:
              single:
                summary: 问题向量化
                value: {model: bge-m3, input: 忘记密码后应该怎么办？, encoding_format: float}
              batch:
                summary: 文档片段批量入库
                value:
                  model: bge-m3
                  input: [员工可通过手机验证码重置登录密码。, 差旅报销需要发票和审批单。]
                  encoding_format: float
      responses:
        '200':
          description: data 按输入顺序返回向量；index 与输入位置对应，usage 汇总本次请求的 token 数。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rag_EmbeddingResponse'}
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/UpstreamError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/UpstreamError'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
        default: {$ref: '#/components/responses/UpstreamError'}
  /monitor/v1/overview:
    get:
      operationId: getMonitoringOverview
      tags: [Monitor]
      summary: '[设计待实现] 已部署服务的状态、显存和最近 60 秒耗时'
      x-implementation-status: proposed
      x-current-http-status: 404
      x-poll-interval-seconds: 5
      description: |
        无请求体和查询参数。每 5 秒采样，返回最近一次采样；耗时按最近 60 秒的已有样本计算。
        仅返回已部署服务；未部署的 RAG/ASR/TTS 等不生成占位记录。同一 name 最多出现一次。
        进程存活且健康检查通过为 running；已部署但未运行（包括主动停止）或检查失败为 error。
        仅 running 返回显存与耗时；error 只含 name、status。显存包含服务的推理子进程。
        MB=1000000 字节，采集源为 MiB 时需换算。采集不到显存返回 null，不以 0 代替。
        YOLO 统计 GPU 端每帧模型推理耗时，排除排队、预处理、NMS 和网络；当前 batch_size=1。
        VLM 统计 GPU 端首 token 延迟，包含服务端排队，不包含 CPU 与 GPU 间网络耗时。
        RAG 统计单次 HTTP 请求在 GPU 主机服务端的完整处理耗时，包含内部排队与处理。
        avg_ms/p95_ms 均为毫秒，P95 是直方图估算；无样本或不可采集时为 null。
        启动不足 60 秒使用已有样本；采样失败或数据过期应返回 503，不以旧数据冒充当前状态。
        具体过期阈值及重启窗口处理见 README 的待 review 细节；本操作当前尚未实现。
      responses:
        '200':
          description: 成功取得监控数据；服务列表中允许包含 error 项。
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control:
              schema: {type: string, const: no-store}
              description: 监控快照不缓存。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitoringOverview'}
              examples:
                running:
                  summary: 当前已部署 YOLO 和 VLM（数值仅示意）
                  value:
                    sampled_at: '2026-09-10T08:00:00Z'
                    window_seconds: 60
                    services:
                      - name: yolo
                        status: running
                        memory_mb: 256.0
                        latency: {metric: model_inference, avg_ms: 12.4, p95_ms: 18.1}
                      - name: vlm
                        status: running
                        memory_mb: 28000.0
                        latency: {metric: time_to_first_token, avg_ms: 320.0, p95_ms: 480.0}
                errorAndIdle:
                  summary: YOLO 正常但无耗时样本，VLM 异常
                  value:
                    sampled_at: '2026-09-10T08:00:05Z'
                    window_seconds: 60
                    services:
                      - name: yolo
                        status: running
                        memory_mb: 256.0
                        latency: {metric: model_inference, avg_ms: null, p95_ms: null}
                      - {name: vlm, status: error}
                noDeployment:
                  summary: 没有部署任何已定义监控口径的算法
                  value: {sampled_at: '2026-09-10T08:00:00Z', window_seconds: 60, services: []}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503':
          description: '[设计] 采样尚未就绪、采集失败或快照过期；不返回旧快照。'
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitoringUnavailable'}
              example: {error: monitor_unavailable}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
components:
  securitySchemes:
    GpuApiKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: CPU 后端持有的 GPU_API_KEY；不是 JWT，也不使用算法内部 key。值区分大小写。
  headers:
    RequestId:
      description: 网关生成并覆盖调用方同名字段的请求 ID；不保证与 vLLM 响应 id 相同。
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  responses:
    Unauthorized:
      description: |
        缺失或错误的共享 API Key 时，NGINX 返回 401 HTML。
        若公开鉴权通过，但网关与 VLM 的内部 key 不一致，上游 401 JSON 也会原样转发。
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        text/html:
          schema: {type: string}
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string, const: Unauthorized}
    Forbidden:
      description: NGINX 方法限制等访问检查失败；当前为 HTML 错误体。
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        text/html:
          schema: {type: string}
    PayloadTooLarge:
      description: NGINX 请求体超过当前配置的 24 MiB 限制。
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        text/html:
          schema: {type: string}
    TooManyRequests:
      description: NGINX 的 VLM 并发数超过 4，或上游限流。不应自动重试生成请求。
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        text/html:
          schema: {type: string}
        application/json:
          schema: {$ref: '#/components/schemas/Vlm_ErrorResponse'}
    BadGateway:
      description: 上游未监听、连接失败或响应无效。NGINX HTML 错误体。
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        text/html:
          schema: {type: string}
    GatewayTimeout:
      description: 上游等待超时，尚未开始响应时由 NGINX 返回 HTML；已开始的 SSE 可能直接断流。
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        text/html:
          schema: {type: string}
    UpstreamError:
      description: |
        vLLM 返回的非成功状态，通常为 ErrorResponse JSON；未捕获异常也可能为 text/plain。
        网关保留上游状态与正文。业务层应对错误正文脱敏，避免公开文档、工具参数或内部信息。
        字段校验错误在本机锁定的 vLLM 中转换为 HTTP 400，不默认采用 FastAPI 的 422 格式。
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Vlm_ErrorResponse'}
        text/plain:
          schema: {type: string}
  schemas:
    GatewayLiveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    YoloReadiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, unavailable]}
    MonitoringOverview:
      type: object
      additionalProperties: false
      required: [sampled_at, window_seconds, services]
      properties:
        sampled_at: {type: string, format: date-time, description: UTC 采样时间。}
        window_seconds: {type: integer, const: 60}
        services:
          type: array
          description: 仅已部署服务，同一 name 最多一项；无部署时为空数组。
          items:
            oneOf:
              - {$ref: '#/components/schemas/RunningService'}
              - {$ref: '#/components/schemas/ErrorService'}
    RunningService:
      type: object
      additionalProperties: false
      required: [name, status, memory_mb, latency]
      properties:
        name: {type: string, enum: [yolo, vlm, rag]}
        status: {type: string, const: running}
        memory_mb:
          type: [number, 'null']
          minimum: 0
          description: 主进程与推理子进程合计显存，十进制 MB；未知为 null。
        latency: {$ref: '#/components/schemas/Latency'}
      allOf:
        - if: {properties: {name: {const: yolo}}}
          then: {properties: {latency: {properties: {metric: {const: model_inference}}}}}
        - if: {properties: {name: {const: vlm}}}
          then: {properties: {latency: {properties: {metric: {const: time_to_first_token}}}}}
        - if: {properties: {name: {const: rag}}}
          then: {properties: {latency: {properties: {metric: {const: http_request}}}}}
    ErrorService:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: {type: string, enum: [yolo, vlm, rag]}
        status: {type: string, const: error}
    Latency:
      type: object
      additionalProperties: false
      required: [metric, avg_ms, p95_ms]
      properties:
        metric: {type: string, enum: [model_inference, time_to_first_token, http_request]}
        avg_ms: {type: [number, 'null'], minimum: 0, description: 最近 60 秒平均耗时；无样本或不可采集为 null。}
        p95_ms: {type: [number, 'null'], minimum: 0, description: 最近 60 秒 P95 耗时估算；无样本或不可估算为 null。}
    MonitoringUnavailable:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string, const: monitor_unavailable}

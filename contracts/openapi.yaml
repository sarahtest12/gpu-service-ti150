          type: integer
        request_id:
          description: The request_id related to this request. If the caller does not set it, a random_uuid
            will be generated. This id is used through out the inference process and return in response.
          title: Request Id
          type: string
        return_tokens_as_token_ids:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: If specified with 'logprobs', tokens are represented  as strings of the form 'token_id:{token_id}'
            so that tokens that are not JSON-encodable can be identified.
          title: Return Tokens As Token Ids
        return_token_ids:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: If specified, the result will include token IDs alongside the generated text. In streaming
            mode, prompt_token_ids is included only in the first chunk, and token_ids contains the delta tokens
            for each chunk. This is useful for debugging or when you need to map generated text back to input
            tokens.
          title: Return Token Ids
        cache_salt:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: If specified, the prefix cache will be salted with the provided string to prevent an
            attacker to guess prompts in multi-user environments. The salt should be random, protected from
            access by 3rd parties, and long enough to be unpredictable (e.g., 43 characters base64-encoded,
            corresponding to 256 bit).
          title: Cache Salt
        kv_transfer_params:
          anyOf:

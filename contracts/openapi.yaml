          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: A Jinja template to use for this conversion. As of transformers v4.44, default chat
            template is no longer allowed, so you must provide a chat template if the tokenizer does not define
            one.
          title: Chat Template
        chat_template_kwargs:
          anyOf:

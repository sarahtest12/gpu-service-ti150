    Rag_EmbeddingCompletionRequest:
      additionalProperties: true
      properties:
        encoding_format:
          default: float
          enum:
          - float
          - base64
          - bytes
          - bytes_only
          title: Encoding Format
          type: string
        embed_dtype:
          default: float32
          description: What dtype to use for encoding. Default to using float32 for base64
            encoding to match the OpenAI python client behavior. This parameter will affect
            base64 and binary_response.
          enum:
          - float32
          - float16
          - bfloat16
          - fp8_e4m3
          - fp8_e5m2
          title: Embed Dtype
          type: string
        endianness:
          default: native
          description: What endianness to use for encoding. Default to using native for
            base64 encoding to match the OpenAI python client behavior.This parameter
            will affect base64 and binary_response.
          enum:
          - native
          - big
          - little
          title: Endianness
          type: string
        dimensions:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Dimensions
        use_activation:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Whether to use activation for the pooler outputs. `None` uses the
            pooler's default, which is `True` in most cases.
          title: Use Activation
        input:
          anyOf:
          - items:
              type: integer
            type: array
          - items:
              items:
                type: integer
              type: array
            type: array
          - type: string
          - items:
              type: string
            type: array
          title: Input
        add_special_tokens:
          default: true
          description: If true (the default), special tokens (e.g. BOS) will be added
            to the prompt.
          title: Add Special Tokens
          type: boolean
        model:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Model
        user:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: User
        truncate_prompt_tokens:
          anyOf:
          - minimum: -1
            type: integer
          - type: 'null'
          default: null
          title: Truncate Prompt Tokens
        request_id:
          description: The request_id related to this request. If the caller does not
            set it, a random_uuid will be generated. This id is used through out the inference
            process and return in response.
          title: Request Id
          type: string
        priority:
          default: 0
          description: 'The priority of the request (lower means earlier handling; default:
            0). Any priority other than 0 will raise an error if the served model does
            not use priority scheduling.'
          title: Priority
          type: integer
        mm_processor_kwargs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: Additional kwargs to pass to the HF processor.
          title: Mm Processor Kwargs
        cache_salt:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: If specified, the prefix cache will be salted with the provided
            string to prevent an attacker to guess prompts in multi-user environments.
            The salt should be random, protected from access by 3rd parties, and long
            enough to be unpredictable (e.g., 43 characters base64-encoded, corresponding
            to 256 bit).
          title: Cache Salt
      required:
      - input
      title: EmbeddingCompletionRequest
      type: object

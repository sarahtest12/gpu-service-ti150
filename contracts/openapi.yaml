          type: boolean
        add_generation_prompt:
          default: true
          description: If true, the generation prompt will be added to the chat template. This is a parameter
            used by chat template in tokenizer config of the model.
          title: Add Generation Prompt
          type: boolean
        continue_final_message:
          default: false
          description: If this is set, the chat will be formatted so that the final message in the chat is
            open-ended, without any EOS tokens. The model will continue this message rather than starting
            a new one. This allows you to "prefill" part of the model's response for it. Cannot be used at
            the same time as `add_generation_prompt`.
          title: Continue Final Message
          type: boolean
        add_special_tokens:
          default: false
          description: If true, special tokens (e.g. BOS) will be added to the prompt on top of what is added
            by the chat template. For most models, the chat template takes care of adding the special tokens
            so this should be set to false (as is the default).
          title: Add Special Tokens
          type: boolean
        documents:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          default: null

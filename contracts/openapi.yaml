        mm_processor_kwargs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: Additional kwargs to pass to the HF processor.
          title: Mm Processor Kwargs
        structured_outputs:
          anyOf:
          - $ref: '#/components/schemas/Vlm_ChatCompletionRequest__StructuredOutputsParams'
          - type: 'null'
          default: null
          description: Additional kwargs for structured outputs
        priority:
          default: 0
          description: 'The priority of the request (lower means earlier handling; default: 0). Any priority
            other than 0 will raise an error if the served model does not use priority scheduling.'

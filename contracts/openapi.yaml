          anyOf:
          - additionalProperties:
              anyOf:
              - type: string
              - type: integer
              - type: number
              - items:
                  anyOf:
                  - type: string
                  - type: integer
                  - type: number
                type: array
            type: object
          - type: 'null'
          default: null
          description: Additional request parameters with (list of) string or numeric values, used by custom
            extensions.
          title: Vllm Xargs
        repetition_detection:
          anyOf:
          - $ref: '#/components/schemas/Vlm_ChatCompletionRequest__RepetitionDetectionParams'
          - type: 'null'
          default: null
          description: Parameters for detecting repetitive N-gram patterns in output tokens. If such repetition
            is detected, generation will be ended early. LLMs can sometimes generate repetitive, unhelpful
            token patterns, stopping only when they hit the maximum output length (e.g. 'abcdabcdabcd...'
            or '\emoji \emoji \emoji ...'). This feature can detect such behavior and terminate early, saving
            time and tokens.
      required:
      - messages
      title: ChatCompletionRequest
      type: object
